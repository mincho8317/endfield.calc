[package]
name = "endfield-calc"
version = "1.0.0"
description = "엔드필드 공장 계산기"
authors = ["mincho8317"]
license = "MIT"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [
  "system-tray",
  "window-all",
  "global-shortcut-all",
  "process-exit",
  "shell-open",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]