name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: endfield-app/src-tauri -> target

      - name: 아이콘 생성
        shell: pwsh
        run: |
          pip install pillow
          $iconDir = "${{ github.workspace }}\endfield-app\src-tauri\icons"
          New-Item -ItemType Directory -Force -Path $iconDir
          $code = @"
          from PIL import Image, ImageDraw
          import math, os
          icon_dir = r'$iconDir'
          os.makedirs(icon_dir, exist_ok=True)
          def make_icon(size):
              img = Image.new('RGBA', (size, size), (0,0,0,0))
              draw = ImageDraw.Draw(img)
              cx, cy, r = size//2, size//2, int(size*0.45)
              pts = [(cx+r*math.cos(math.radians(60*i-30)), cy+r*math.sin(math.radians(60*i-30))) for i in range(6)]
              draw.polygon(pts, fill=(240,200,22,255))
              return img
          make_icon(32).save(os.path.join(icon_dir, '32x32.png'))
          make_icon(128).save(os.path.join(icon_dir, '128x128.png'))
          make_icon(256).save(os.path.join(icon_dir, '128x128@2x.png'))
          sizes = [16,32,48,64,128,256]
          imgs = [make_icon(s) for s in sizes]
          imgs[0].save(os.path.join(icon_dir, 'icon.ico'), format='ICO', sizes=[(s,s) for s in sizes], append_images=imgs[1:])
          make_icon(256).save(os.path.join(icon_dir, 'icon.icns'))
          "@
          $code | python

      - name: 사이트 HTML 복사
        shell: bash
        run: cp index.html endfield-app/src/endfield_factory_calc.html

      - name: npm 의존성 설치
        working-directory: ./endfield-app
        run: npm install

      - name: Tauri 앱 빌드
        working-directory: ./endfield-app
        run: npm run build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: 파일명 고정
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./dist
          $nsis = Get-ChildItem -Path "endfield-app/src-tauri/target/release/bundle/nsis/" -Filter "*.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName -Destination "./dist/Endfield-Factory-Calc-setup.exe"
            Write-Host "NSIS 복사: $($nsis.Name)"
          } else {
            $msi = Get-ChildItem -Path "endfield-app/src-tauri/target/release/bundle/msi/" -Filter "*.msi" | Select-Object -First 1
            if ($msi) {
              Copy-Item $msi.FullName -Destination "./dist/Endfield-Factory-Calc-setup.exe"
              Write-Host "MSI 복사: $($msi.Name)"
            } else {
              Write-Error "빌드 파일을 찾을 수 없어요"
              exit 1
            }
          }

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: endfield-calc-windows
          path: ./dist/Endfield-Factory-Calc-setup.exe
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 결과물 다운로드
        uses: actions/download-artifact@v4
        with:
          name: endfield-calc-windows
          path: ./dist

      - name: GitHub Release 생성
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/Endfield-Factory-Calc-setup.exe
          body: |
            ## Endfield Factory Calc ${{ github.ref_name }}

            ### Install
            1. Download `Endfield-Factory-Calc-setup.exe`
            2. Run (Security warning -> "More info" -> "Run anyway")
            3. Done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}