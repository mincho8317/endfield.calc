name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rust 설치
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: endfield-app/src-tauri -> target

      - name: 사이트 HTML 복사
        shell: bash
        run: cp index.html endfield-app/src/endfield_factory_calc.html

      - name: npm 의존성 설치
        working-directory: ./endfield-app
        run: npm install

      - name: Tauri 앱 빌드
        working-directory: ./endfield-app
        run: npm run build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: endfield-calc-windows
          path: |
            endfield-app/src-tauri/target/release/bundle/msi/*.msi
            endfield-app/src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 결과물 다운로드
        uses: actions/download-artifact@v4
        with:
          name: endfield-calc-windows
          path: ./dist

      - name: GitHub Release 생성
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./dist/**/*.exe
            ./dist/**/*.msi
          body: |
            ## 엔드필드 공장 계산기 ${{ github.ref_name }}

            ### 설치 방법
            1. `.exe` 파일 다운로드
            2. 실행 (보안 경고 → "추가 정보" → "실행" 클릭)
            3. 설치 완료
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}